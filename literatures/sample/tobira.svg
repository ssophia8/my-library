<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <!-- 【文例】作品の扉の画像。本物は縦長（よこ 2：たて 3 くらい）の PNG や JPG で作ります -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252c37"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e4c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3e4c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1536" fill="url(#night)"/>
  <ellipse cx="512" cy="700" rx="60" ry="420" fill="url(#glow)"/>
  <g fill="#f3e4c8" font-family="Hiragino Mincho ProN, YuMincho, serif" text-anchor="middle">
    <text x="512" y="1260" font-size="56" letter-spacing="12">扉の画像</text>
    <text x="512" y="1340" font-size="30" letter-spacing="4" fill-opacity="0.7">よこ 2：たて 3 くらいの縦長がおすすめ</text>
  </g>
</svg>
